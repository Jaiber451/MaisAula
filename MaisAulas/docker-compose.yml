services:
  db:
    image: mysql:8.4
    container_name: aula-conectada-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aula_conectada
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/create_database.sql:/docker-entrypoint-initdb.d/01-create_database.sql:ro

volumes:
  mysql_data:
